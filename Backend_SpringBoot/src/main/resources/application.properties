spring.application.name=kageguard-backend
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:kageguarddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Browser database viewer
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Load secrets from a separate file (ignored if it does not exist)
spring.config.import=optional:file:./secrets.properties

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Alerts
kageguard.alerts.enabled=true
kageguard.alerts.email.enabled=true
kageguard.alerts.telegram.enabled=true
kageguard.alerts.rain-cooldown-seconds=300
kageguard.alerts.source=simulated


# Fake packet generator (set to false to turn it off)
kageguard.simulator.enabled=true